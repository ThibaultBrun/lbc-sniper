# Watches LBC. Chacun = une recherche regulière.
# Un watch peut partager son `category_label` avec d'autres watches : ils sont
# alors regroupes ensemble dans le filtre du site web.

watches:

  # ============================================================================
  # VTT — Recherches France entiere, fenetre de 24h glissante
  # `incremental_hours: 24` -> on pagine jusqu'a tomber sur une annonce > 24h.
  # Pas de location -> France entiere. Le filtre geographique se fait cote site.
  # ============================================================================

  - id: vtt-enduro-france
    label: "VTT Enduro - France entiere"
    category_label: "VTT enduro"
    category: VEHICULES_VELOS
    text: "enduro"
    search_in_title_only: true
    limit: 100
    incremental_hours: 24
    enrichment_domain: "vtt_enduro"

  - id: vtt-dh-france
    label: "VTT DH (descente) - France entiere"
    category_label: "VTT DH"
    category: VEHICULES_VELOS
    text: "dh"
    search_in_title_only: true
    limit: 100
    incremental_hours: 24
    enrichment_domain: "vtt_dh"

  # ============================================================================
  # MOTOS A2 (125-500cc, 2010+)
  # ============================================================================

  - id: motos-125-500-bayonne
    label: "Motos 125-500cc, 2010+ - 50km autour de Bayonne"
    category_label: "Motos"
    category: VEHICULES_MOTOS
    accept_category_ids: ["3"]
    location:
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 50
    limit: 100
    enrichment_domain: "moto"
    attribute_filters:
      cubic_capacity:
        min: 125
        max: 500
      regdate:
        min: 2010

  # ============================================================================
  # VOITURES — ludospaces et monospaces familiaux (un watch par modele)
  # Tous regroupes dans le label "Voitures" cote UI.
  # search_in_title_only: true pour eviter les annonces qui mentionnent juste
  # le modele dans le body (ex: "alternative au Berlingo").
  # ============================================================================

  - id: voiture-berlingo-bayonne
    label: "Citroen Berlingo - 50km autour de Bayonne"
    category_label: "Voitures"
    category: VEHICULES_VOITURES
    accept_category_ids: ["2"]
    text: "berlingo"
    search_in_title_only: true
    location: &bayonne_50
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 50
    limit: 50
    enrichment_domain: "voiture"
    attribute_filters: &voiture_filters
      mileage:
        max: 150000

  - id: voiture-partner-bayonne
    label: "Peugeot Partner - 50km autour de Bayonne"
    category_label: "Voitures"
