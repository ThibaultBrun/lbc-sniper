watches:
  - id: vtt-enduro-bayonne
    label: "VTT Enduro - 30km autour de Bayonne"
    category: VEHICULES_VELOS
    # LBC élargit la recherche aux catégories proches quand le texte matche
    # plusieurs univers (ex: "enduro" = vélos + motos). On filtre donc côté
    # Python sur les category_id retournés par l'API. 55 = Vélos.
    accept_category_ids: ["55"]
    text: "enduro"
    location:
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 30
    price_max: 5000
    limit: 100
    enrichment_domain: "vtt_enduro"

  - id: ludospace-voitures-bayonne
    label: "Ludospaces (voitures) - 50km autour de Bayonne"
    category: VEHICULES_VOITURES
    accept_category_ids: ["2"]
    location:
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 50
    limit: 100
    enrichment_domain: "ludospace"

  - id: ludospace-utilitaires-bayonne
    label: "Ludospaces (utilitaires 4+ places) - 50km autour de Bayonne"
    category: VEHICULES_UTILITAIRES
    accept_category_ids: ["5"]
    location:
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 50
    limit: 100
    # Le prompt ludospace impose la règle "≥4 places" pour cette catégorie.
    enrichment_domain: "ludospace_utilitaire"

  - id: motos-125-500-bayonne
    label: "Motos 125-500cc, 2010+ - 50km autour de Bayonne"
    category: VEHICULES_MOTOS
    accept_category_ids: ["3"]
    location:
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 50
    limit: 100
    enrichment_domain: "moto"
    # Filtres côté client sur les attributs LBC (avant enrichissement Claude).
    # cubic_capacity = "300 cm²" / regdate = "2011" — on extrait le 1er entier.
    attribute_filters:
      cubic_capacity:
        min: 125
        max: 500
      regdate:
        min: 2010
