# Watches LBC. Chacun = une recherche regulière.
# Un watch peut partager son `category_label` avec d'autres watches : ils sont
# alors regroupes ensemble dans le filtre du site web.

watches:

  # ============================================================================
  # VTT — Sud-Ouest (100km autour de Bayonne), fenetre de 24h glissante
  # `incremental_hours: 24` -> on pagine jusqu'a tomber sur une annonce > 24h.
  # Le filtre geographique est fait cote LBC via l'API location (radius_km).
  # ============================================================================

  - id: vtt-bayonne
    label: "VTT Sud Ouest (200km Bayonne)"
    # category_label sera surcharge par auto_classify_vtt avec
    # 'VTT enduro' / 'VTT DH' / 'VTT XC' / 'VTT dirt' selon le signal trouve.
    category_label: "VTT enduro"
    category: LOISIRS_VELOS
    # Filtre geographique : 200km autour de Bayonne -> couvre tout le Sud Ouest
    # (Pays basque, Landes, Bearn, Gironde sud, Pyrenees, Gers, Haute-Garonne).
    location:
      city: Bayonne
      lat: 43.4933
      lng: -1.4747
      radius_km: 200
    limit: 100
    incremental_hours: 24
    auto_classify_vtt: true
    enrichment_domain: "vtt_enduro"

